# Enable the H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Force Spring Boot to run schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.sql.init.platform=h2

# In-memory database connection string
spring.datasource.url=jdbc:h2:mem:purchaseOrder
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Debug Logs
logging.level.sql=debug
logging.level.org.springframework.test.context.transaction.TransactionContext=debug

# JPA/Hybernate DDL Auto Flag
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Eureka Identifier
spring.application.name=purchase-order-service
eureka.instance.prefer-ip-address=true

# The Impact Analytics Service Base URL
IMPACT.ANALYTICS.BASE_URL=http://IMPACT-ANALYTICS-SERVICE

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.impactAnalytics.sliding-window-size=5
resilience4j.circuitbreaker.instances.impactAnalytics.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.impactAnalytics.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.impactAnalytics.permitted-number-of-calls-in-half-open-state=2